<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>回声 · Sonar</title>
  <style>
    /* 设计提示：盲域极简主义——空间只由回声暂时证明；章节日志提供叙事，绝不覆盖黑场。 */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    #game-canvas { display: block; width: 100vw; height: 100vh; background: #000; cursor: crosshair; touch-action: none; }
    .hud { position: fixed; z-index: 2; pointer-events: none; user-select: none; }
    #brand { top: 16px; left: 20px; display: flex; align-items: center; gap: 11px; color: rgba(255,255,255,.53); font-size: 10px; letter-spacing: .26em; text-transform: uppercase; }
    #brand .mark-wrap { position: relative; display: block; width: 30px; height: 30px; }
    #brand img, #brand .sonar-mark { position: absolute; inset: 0; width: 30px; height: 30px; display: block; object-fit: contain; }
    #brand img { z-index: 1; opacity: 1; filter: contrast(1.22) brightness(1.16); }
    #brand .sonar-mark { z-index: 0; overflow: visible; }
    #brand .sonar-mark path { fill: none; stroke: rgba(246,246,242,.9); stroke-width: 1.15; }
    #brand .sonar-mark circle { fill: #f6f6f2; }
    #brand .sonar-mark line { stroke: rgba(161,42,48,.75); stroke-width: 1.15; }
    #brand .wordmark { display: grid; gap: 2px; }
    #brand .wordmark small { color: rgba(255,255,255,.26); font-size: 7px; letter-spacing: .19em; }
    #chapter { top: 82px; left: 20px; display: grid; gap: 5px; color: rgba(255,255,255,.38); font-size: 8px; letter-spacing: .15em; }
    #chapter strong { color: rgba(255,255,255,.72); font-size: 9px; font-weight: 400; letter-spacing: .19em; }
    #chapter-pips { display: flex; gap: 5px; align-items: center; }
    #chapter-pips i { display: block; width: 13px; height: 1px; background: rgba(255,255,255,.16); }
    #chapter-pips i.active { background: rgba(246,246,242,.8); box-shadow: 0 0 5px rgba(255,255,255,.42); }
    #chapter-pips i.done { background: rgba(211,170,88,.54); }
    #usage { top: 20px; right: 24px; color: rgba(255,255,255,.49); text-align: right; font-size: 9px; line-height: 1.65; letter-spacing: .16em; }
    #usage strong { display: block; color: rgba(255,255,255,.84); font-size: 14px; font-weight: 400; letter-spacing: .22em; }
    #resources { top: 60px; right: 24px; display: grid; justify-items: end; gap: 6px; color: rgba(255,255,255,.31); font-size: 8px; letter-spacing: .14em; }
    #charge-pips { display: flex; gap: 4px; }
    #charge-pips i { display: block; width: 14px; height: 2px; background: rgba(255,255,255,.12); transition: background .2s ease, box-shadow .2s ease; }
    #charge-pips i.ready { background: rgba(246,246,242,.78); box-shadow: 0 0 5px rgba(255,255,255,.35); }
    #alert { color: rgba(212,67,73,.37); }
    #alert.high { color: rgba(212,67,73,.88); }
    #timer { color: rgba(211,170,88,.35); }
    #timer.hot { color: rgba(211,170,88,.88); }
    #objective { right: 24px; bottom: 18px; display: grid; justify-items: end; gap: 3px; color: rgba(211,170,88,.48); font-size: 8px; letter-spacing: .14em; }
    #objective strong { color: rgba(227,191,114,.9); font-size: 10px; font-weight: 400; letter-spacing: .18em; }
    #exit-state { color: rgba(255,255,255,.24); font-size: 7px; letter-spacing: .13em; }
    #exit-state.unlocked { color: rgba(211,170,88,.72); }
    #log-line { left: 20px; bottom: 52px; max-width: min(56vw, 510px); color: rgba(227,191,114,.64); font-size: 9px; letter-spacing: .12em; line-height: 1.8; transition: opacity .25s ease; }
    #hint { left: 20px; bottom: 18px; color: rgba(255,255,255,.28); font-size: 8px; letter-spacing: .13em; line-height: 2.05; transition: opacity .65s ease; }
    #status { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .3s ease; background: rgba(0,0,0,.14); }
    #status.visible { opacity: 1; pointer-events: auto; cursor: crosshair; }
    #status .message { width: min(78vw, 620px); transform: translateY(-3vh); text-align: center; color: #f2f2f0; text-shadow: 0 0 18px rgba(255,255,255,.19); }
    #status .message.danger { color: #d44349; text-shadow: 0 0 22px rgba(161,42,48,.42); }
    #status .eyebrow { margin: 0 0 12px; color: rgba(211,170,88,.62); font-size: 9px; letter-spacing: .23em; }
    #status h1 { margin: 0 0 14px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 5vw, 66px); font-weight: 400; letter-spacing: .07em; }
    #status p { margin: 0; color: rgba(255,255,255,.48); font-size: 10px; letter-spacing: .14em; line-height: 2; }
    @media (max-width: 560px) {
      #brand { top: 11px; left: 14px; } #brand .wordmark { display: none; }
      #chapter { top: 70px; left: 14px; } #usage { top: 14px; right: 14px; }
      #resources { top: 52px; right: 14px; } #objective { right: 14px; bottom: 13px; }
      #log-line { left: 14px; bottom: 52px; max-width: 54vw; font-size: 8px; }
      #hint { left: 14px; bottom: 13px; max-width: 160px; font-size: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { #status, #hint, #log-line { transition: none; } }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="回声 Sonar 游戏画布"></canvas>
  <div id="brand" class="hud"><span class="mark-wrap" aria-hidden="true"><svg class="sonar-mark" viewBox="0 0 24 24"><path d="M12 3 A9 9 0 1 0 20.5 8.9"/><circle cx="12" cy="12" r="1.55"/><line x1="19.2" y1="4.8" x2="21.4" y2="2.6"/></svg><img src="/manus-storage/sonar-logo_9e3805c0.png" alt="" onerror="this.style.display='none'" /></span><span class="wordmark">回声 // SONAR<small>ACOUSTIC RECORD // 01</small></span></div>
  <div id="chapter" class="hud"><strong id="chapter-label">章节 I / IV</strong><div id="chapter-pips" aria-hidden="true"><i class="active"></i><i></i><i></i><i></i></div><span id="chapter-name">静水观测</span></div>
  <div id="usage" class="hud">声呐使用次数<strong id="count">00</strong></div>
  <div id="resources" class="hud"><span>回响电荷</span><div id="charge-pips" aria-label="声呐电荷"><i class="ready"></i><i class="ready"></i><i class="ready"></i></div><span id="alert">警觉 // 00</span><span id="timer"></span></div>
  <div id="objective" class="hud">章节记录<strong id="record-count">00 / 00</strong><span id="exit-state">出口封存</span></div>
  <div id="log-line" class="hud"></div>
  <div id="hint" class="hud">输入 // LMB 声呐 · WASD 位移<br>SPACE // 外置回声（授权后）</div>
  <div id="status"><div class="message"><p id="status-eyebrow" class="eyebrow"></p><h1 id="status-title"></h1><p id="status-copy"></p></div></div>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    const chapterLabelEl = document.getElementById("chapter-label");
    const chapterNameEl = document.getElementById("chapter-name");
    const chapterPipsEl = document.getElementById("chapter-pips");
    const countEl = document.getElementById("count");
    const chargePipsEl = document.getElementById("charge-pips");
    const alertEl = document.getElementById("alert");
    const timerEl = document.getElementById("timer");
    const recordCountEl = document.getElementById("record-count");
    const exitStateEl = document.getElementById("exit-state");
    const logEl = document.getElementById("log-line");
    const hintEl = document.getElementById("hint");
    const statusEl = document.getElementById("status");
    const statusEyebrow = document.getElementById("status-eyebrow");
    const statusTitle = document.getElementById("status-title");
    const statusCopy = document.getElementById("status-copy");

    const COLORS = { white: "#f6f6f2", red: "#a12a30", gold: "#d3aa58" };
    const BORDER = [[.035,.055,.93,.010],[.035,.935,.93,.010],[.035,.055,.010,.89],[.955,.055,.010,.89]];
    const CHAPTERS = [
      {
        id: "I", title: "静水观测", subtitle: "先听见它，再决定前进。", mood: "观察巡逻", fade: 1800, pulseRange: .62, pulseSpeed: .72, cooldown: 2250, baseMonsterSpeed: .060,
        player: [.09,.86], exit: [.92,.13], records: [{ p:[.68,.22], line:"记录 01 // 水位稳定。它在目标前折返。" }],
        monsters: [{ p:[.52,.59], route:[[.52,.59],[.73,.59],[.73,.36],[.58,.36]], speed: .034 }], shelters: [],
        walls: [...BORDER,[.16,.10,.008,.57],[.16,.48,.18,.009],[.31,.22,.008,.50],[.31,.22,.17,.009],[.48,.10,.008,.44],[.48,.54,.22,.009],[.70,.26,.008,.55],[.70,.26,.20,.009],[.86,.11,.008,.45],[.58,.75,.28,.009],[.48,.75,.008,.14],[.16,.75,.18,.009],[.095,.79,.115,.009]]
      },
      {
        id: "II", title: "诱饵走廊", subtitle: "声音不必总从你身上发出。", mood: "主动诱导", fade: 1350, pulseRange: .56, pulseSpeed: .69, cooldown: 2450, baseMonsterSpeed: .078,
        player: [.09,.14], exit: [.92,.86], records: [{ p:[.31,.22], line:"记录 02 // 外置声源已校准。", grant:"bait" },{ p:[.71,.73], line:"记录 03 // 走廊尽头仍有回声。" }],
        monsters: [{ p:[.46,.42], route:[[.46,.42],[.66,.42],[.66,.68],[.46,.68]], speed:.041 },{ p:[.79,.73], route:[[.79,.73],[.90,.73],[.90,.48],[.79,.48]], speed:.038 }], shelters: [],
        walls: [...BORDER,[.19,.12,.008,.58],[.19,.70,.18,.009],[.37,.245,.008,.60],[.37,.245,.21,.009],[.57,.09,.008,.51],[.57,.60,.18,.009],[.75,.30,.008,.57],[.75,.30,.15,.009],[.09,.36,.16,.009],[.44,.76,.17,.009],[.845,.645,.09,.009]]
      },
      {
        id: "III", title: "无声舱", subtitle: "静默不是安全，只是一次重新判断。", mood: "藏身重置", fade: 1080, pulseRange: .53, pulseSpeed: .67, cooldown: 2650, baseMonsterSpeed: .091,
        player: [.09,.84], exit: [.92,.15], records: [{ p:[.30,.56], line:"记录 04 // 静默舱会切断追踪。" },{ p:[.72,.29], line:"记录 05 // 不要在门前停留。" }],
        monsters: [{ p:[.39,.37], route:[[.39,.37],[.57,.37],[.57,.57],[.39,.57]], speed:.045 },{ p:[.77,.64], route:[[.77,.64],[.89,.64],[.89,.36],[.77,.36]], speed:.042 }],
        shelters: [[.46,.72,.036],[.70,.56,.034]],
        walls: [...BORDER,[.14,.11,.008,.62],[.14,.35,.15,.009],[.29,.21,.008,.62],[.29,.21,.16,.009],[.45,.10,.008,.50],[.45,.60,.19,.009],[.64,.25,.008,.59],[.64,.25,.21,.009],[.84,.10,.008,.46],[.71,.74,.16,.009],[.455,.785,.008,.105],[.12,.79,.13,.009],[.815,.61,.10,.009]]
      },
      {
        id: "IV", title: "崩塌之门", subtitle: "最后一条记录会唤醒整座迷宫。", mood: "追猎撤离", fade: 900, pulseRange: .50, pulseSpeed: .65, cooldown: 2850, baseMonsterSpeed: .102, huntDuration: 25000,
        player: [.09,.85], exit: [.92,.12], records: [{ p:[.47,.47], line:"记录 06 // 门正在收拢。现在，离开。", trigger:"hunt" }],
        monsters: [{ p:[.25,.31], route:[[.25,.31],[.46,.31],[.46,.60],[.25,.60]], speed:.048 },{ p:[.67,.31], route:[[.67,.31],[.87,.31],[.87,.60],[.67,.60]], speed:.049 },{ p:[.69,.76], route:[[.69,.76],[.88,.76],[.88,.48],[.69,.48]], speed:.045 }],
        shelters: [[.54,.72,.034]],
        walls: [...BORDER,[.17,.10,.008,.54],[.17,.64,.18,.009],[.35,.24,.008,.60],[.35,.24,.19,.009],[.54,.10,.008,.46],[.54,.56,.17,.009],[.71,.29,.008,.55],[.71,.29,.17,.009],[.86,.10,.008,.42],[.10,.42,.18,.009],[.48,.79,.19,.009],[.77,.69,.12,.009]]
      }
    ];
    const DEMO = new URLSearchParams(location.search).has("demo");

    let width = 0, height = 0, dpr = 1, lastTime = performance.now(), pulseId = 0;
    let chapterIndex = 0, state = "brief", player, exit, monsters, records, shelters, pulses, traces, reveal, keys, bait, audio;
    let sonarCount = 0, runDeaths = 0, charge = 3, nextChargeAt = 0, alert = 0, lastEchoAt = 0, logUntil = 0, huntUntil = 0, lastHuntTargetAt = 0, lastDemoAt = 0;

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
    function currentChapter() { return CHAPTERS[chapterIndex]; }
    function pointAt([x, y]) { return { x:x * width, y:y * height }; }
    function screenWalls() { return currentChapter().walls.map(([x,y,w,h]) => ({ x:x * width, y:y * height, w:w * width, h:h * height })); }
    function isSheltered() { return shelters.some(shelter => dist(player.x, player.y, shelter.x, shelter.y) < shelter.r); }
    function showLog(text, duration = 3600) { logEl.textContent = text; logUntil = performance.now() + duration; }
    function tone(frequency, duration, volume, type = "sine", slideTo = null) {
      if (!audio) return;
      const now = audio.currentTime, oscillator = audio.createOscillator(), gain = audio.createGain();
      oscillator.type = type; oscillator.frequency.setValueAtTime(frequency, now);
      if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now + duration);
      gain.gain.setValueAtTime(.0001, now); gain.gain.exponentialRampToValueAtTime(volume, now + .018); gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
      oscillator.connect(gain).connect(audio.destination); oscillator.start(now); oscillator.stop(now + duration + .04);
    }
    function ensureAudio() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); }
    function sonarSound() { tone(112,.62,.072,"sine",42); tone(57,.54,.035,"triangle",35); }
    function echoSound(kind) { tone(kind === "monster" ? 420 : 620, kind === "monster" ? .10 : .075, .018, "sine", kind === "monster" ? 270 : 430); }
    function recordSound() { tone(784,.12,.028,"sine",1047); tone(523,.20,.018,"triangle",784); }
    function baitSound() { tone(180,.22,.036,"triangle",75); }
    function failSound() { tone(50,.64,.09,"sawtooth",24); tone(95,.38,.035,"triangle",38); }

    function updateHud(now = performance.now()) {
      const chapter = currentChapter();
      chapterLabelEl.textContent = `章节 ${chapter.id} / IV`;
      chapterNameEl.textContent = chapter.title;
      chapterPipsEl.querySelectorAll("i").forEach((pip, index) => pip.className = index < chapterIndex ? "done" : index === chapterIndex ? "active" : "");
      countEl.textContent = String(sonarCount).padStart(2,"0");
      chargePipsEl.querySelectorAll("i").forEach((pip,index) => pip.className = index < charge ? "ready" : "");
      alertEl.textContent = `警觉 // ${String(Math.round(alert * 100)).padStart(2,"0")}`;
      alertEl.classList.toggle("high", alert >= .62);
      recordCountEl.textContent = `${String(records.filter(record => record.collected).length).padStart(2,"0")} / ${String(records.length).padStart(2,"0")}`;
      exitStateEl.textContent = exit.unlocked ? "出口已解锁" : "出口封存";
      exitStateEl.classList.toggle("unlocked", exit.unlocked);
      if (huntUntil > now) { const seconds = Math.ceil((huntUntil - now) / 1000); timerEl.textContent = `门闭合 // ${String(seconds).padStart(2,"0")}s`; timerEl.classList.add("hot"); }
      else { timerEl.textContent = bait && bait.ready ? `诱饵 // ${bait.pulsesLeft}` : ""; timerEl.classList.remove("hot"); }
      logEl.style.opacity = now < logUntil ? "1" : "0";
    }

    function showStatus(kind, eyebrow, title, copy) {
      statusEyebrow.textContent = eyebrow;
      statusTitle.textContent = title;
      statusCopy.textContent = copy;
      statusEl.querySelector(".message").classList.toggle("danger", kind === "danger");
      statusEl.classList.add("visible");
    }
    function hideStatus() { statusEl.classList.remove("visible"); }

    function loadChapter(index, resetRun = false) {
      chapterIndex = clamp(index, 0, CHAPTERS.length - 1);
      const chapter = currentChapter();
      player = { ...pointAt(chapter.player), r:5.5, exposedUntil:0 };
      exit = { ...pointAt(chapter.exit), r:7, revealUntil:0, unlocked:false };
      monsters = chapter.monsters.map((monster, id) => ({ ...pointAt(monster.p), id, r:10, route:monster.route.map(pointAt), routeIndex:0, speed:monster.speed, target:null, mode:"patrol", searchUntil:0, revealUntil:0, phase:Math.random() * Math.PI * 2 }));
      records = chapter.records.map((record, id) => ({ ...pointAt(record.p), id, r:7, line:record.line, grant:record.grant, trigger:record.trigger, collected:false, revealUntil:0 }));
      shelters = chapter.shelters.map(([x,y,r]) => ({ x:x * width, y:y * height, r:r * Math.min(width,height), revealUntil:0 }));
      pulses = []; traces = []; reveal = new Array(chapter.walls.length).fill(0); keys = Object.create(null); bait = null;
      charge = 3; nextChargeAt = 0; alert = 0; huntUntil = 0; lastHuntTargetAt = 0; lastEchoAt = 0; lastDemoAt = performance.now() - 1600;
      if (resetRun) { sonarCount = 0; runDeaths = 0; }
      state = "brief";
      updateHud();
      showStatus("brief", `章节 ${chapter.id} // ${chapter.mood}`, chapter.title, `${chapter.subtitle}  ENTER / 左键开始`);
      showLog(`系统记录 // ${chapter.subtitle}`, 4200);
    }
    function beginChapter() { if (state !== "brief") return; ensureAudio(); state = "playing"; hideStatus(); hintEl.style.opacity = "1"; showLog("目标载入 // 读取全部章节记录。", 2400); }
    function nextChapter() { if (state !== "interchapter") return; if (chapterIndex < CHAPTERS.length - 1) loadChapter(chapterIndex + 1); }
    function startNewRun() { loadChapter(0, true); }

    function resize() {
      const oldWidth = width || innerWidth, oldHeight = height || innerHeight;
      width = Math.max(1, innerWidth); height = Math.max(1, innerHeight); dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.floor(width * dpr); canvas.height = Math.floor(height * dpr); canvas.style.width = width + "px"; canvas.style.height = height + "px"; ctx.setTransform(dpr,0,0,dpr,0,0);
      if (player) {
        const sx = width / oldWidth, sy = height / oldHeight;
        [player,exit,...monsters,...records,...shelters].forEach(entity => { entity.x *= sx; entity.y *= sy; if (entity.route) entity.route.forEach(point => { point.x *= sx; point.y *= sy; }); if (entity.r && entity !== player && entity !== exit) entity.r *= Math.min(sx,sy); });
        pulses.forEach(pulse => { pulse.x *= sx; pulse.y *= sy; pulse.radius *= Math.min(sx,sy); });
        if (bait) { bait.x *= sx; bait.y *= sy; }
      }
    }
    function collides(x, y, radius) {
      for (const wall of screenWalls()) { const nx = clamp(x,wall.x,wall.x+wall.w), ny = clamp(y,wall.y,wall.y+wall.h); if (dist(x,y,nx,ny) < radius) return true; }
      return false;
    }
    function move(entity, dx, dy) { if (!collides(entity.x + dx,entity.y,entity.r)) entity.x += dx; if (!collides(entity.x,entity.y + dy,entity.r)) entity.y += dy; }
    function makePulse(x,y,type = "player") { return { id:++pulseId, x,y,type,radius:0,previousRadius:0,max:Math.hypot(width,height) * currentChapter().pulseRange,speed:Math.min(width,height) * currentChapter().pulseSpeed,hitWalls:new Set(),hitMonsters:new Set(),hitRecords:new Set(),hitShelters:new Set(),hitExit:false }; }
    function emitPulse() {
      if (state !== "playing") return;
      ensureAudio();
      const now = performance.now();
      if (charge <= 0) { showLog("回响电荷尚未恢复。", 1500); return; }
      charge -= 1; if (!nextChargeAt) nextChargeAt = now + currentChapter().cooldown;
      alert = clamp(alert + .31, 0, 1); player.exposedUntil = now + 460; sonarCount += 1; pulses.push(makePulse(player.x,player.y)); sonarSound(); hintEl.style.opacity = "0"; updateHud(now);
    }
    function deployBait() {
      if (state !== "playing" || !records.some(record => record.grant === "bait" && record.collected) || bait) return;
      const now = performance.now();
      bait = { x:player.x, y:player.y, ready:false, armedAt:now + 650, nextPulseAt:now + 720, expiresAt:now + 4300, pulsesLeft:3 };
      baitSound(); showLog("回声诱饵已部署 // 延迟声源即将启动。", 2400); updateHud(now);
    }
    function sourceHitsRect(pulse, wall) { const x = clamp(pulse.x,wall.x,wall.x+wall.w), y = clamp(pulse.y,wall.y,wall.y+wall.h), gap = dist(pulse.x,pulse.y,x,y); return gap > pulse.previousRadius - 4 && gap <= pulse.radius + 4; }
    function setMonsterTarget(monster,x,y,now) { monster.target = {x,y}; monster.mode = "investigate"; monster.searchUntil = now + 1900; }
    function scanPulse(pulse, now) {
      const walls = screenWalls();
      if (pulse.type === "player") {
        walls.forEach((wall,index) => { if (!pulse.hitWalls.has(index) && sourceHitsRect(pulse,wall)) { pulse.hitWalls.add(index); reveal[index] = now + currentChapter().fade; if (now - lastEchoAt > 76) { echoSound("wall"); lastEchoAt = now; } } });
        shelters.forEach((shelter,index) => { const d = dist(pulse.x,pulse.y,shelter.x,shelter.y); if (!pulse.hitShelters.has(index) && d > pulse.previousRadius - shelter.r && d <= pulse.radius + shelter.r) { pulse.hitShelters.add(index); shelter.revealUntil = now + currentChapter().fade; } });
        records.forEach(record => { const d = dist(pulse.x,pulse.y,record.x,record.y); if (!record.collected && !pulse.hitRecords.has(record.id) && d > pulse.previousRadius - record.r && d <= pulse.radius + record.r) { pulse.hitRecords.add(record.id); record.collected = true; record.revealUntil = now + currentChapter().fade * 1.4; recordSound(); showLog(record.line,4200); if (record.grant) showLog(`${record.line}  空格：部署回声诱饵。`,4600); if (record.trigger === "hunt") { huntUntil = now + currentChapter().huntDuration; showLog("记录 06 // 门正在收拢。撤离倒计时启动。",4600); tone(140,.34,.06,"sawtooth",72); } if (records.every(item => item.collected)) { exit.unlocked = true; exit.revealUntil = now + currentChapter().fade * 2; showLog(record.trigger ? "出口坐标已锁定。不要停下。" : "章节记录完整。出口坐标已恢复。",3500); } updateHud(now); } });
        const exitDistance = dist(pulse.x,pulse.y,exit.x,exit.y); if (!pulse.hitExit && exitDistance > pulse.previousRadius - exit.r && exitDistance <= pulse.radius + exit.r) { pulse.hitExit = true; exit.revealUntil = now + currentChapter().fade * 1.8; }
      }
      monsters.forEach(monster => { const d = dist(pulse.x,pulse.y,monster.x,monster.y); if (!pulse.hitMonsters.has(monster.id) && d > pulse.previousRadius - monster.r && d <= pulse.radius + monster.r) { pulse.hitMonsters.add(monster.id); monster.revealUntil = now + currentChapter().fade; setMonsterTarget(monster,pulse.x,pulse.y,now); if (now - lastEchoAt > 76) { echoSound("monster"); lastEchoAt = now; } } });
    }
    function endGame(result) {
      if (state !== "playing") return;
      if (result === "lost") { state = "lost"; runDeaths += 1; failSound(); showStatus("danger", `章节 ${currentChapter().id} // 信号中断`, "你被吞噬了", "R 重试本章。下一次回声也许会来自别处。" ); return; }
      if (chapterIndex === CHAPTERS.length - 1) { state = "won"; const score = sonarCount + runDeaths * 5; const rating = score <= 26 ? "静默穿越" : score <= 42 ? "受控残响" : "失真回声"; showStatus("brief","记录恢复完毕","回声仍在", `4 个章节 · 声呐 ${String(sonarCount).padStart(2,"0")} 次 · ${rating} · R 重新进入`); return; }
      state = "interchapter"; showStatus("brief", `章节 ${currentChapter().id} // 记录恢复`, "门已开启", `下一章节：${CHAPTERS[chapterIndex + 1].title} · ENTER / 左键继续`);
    }
    function updatePlayer(delta) { const dx = (keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0), dy = (keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0); if (!dx&&!dy) return; const length = Math.hypot(dx,dy), speed = Math.min(width,height) * .244; move(player,dx/length*speed*delta,dy/length*speed*delta); }
    function updateMonster(monster, delta, now) {
      const sheltered = isSheltered();
      if (sheltered && monster.mode !== "patrol") { monster.target = null; monster.mode = "patrol"; }
      let target = monster.target;
      if (target) { const dx = target.x-monster.x, dy=target.y-monster.y, length=Math.hypot(dx,dy); if (length < 7) { monster.target=null; monster.mode="search"; monster.searchUntil=now+1500; } else { const speed = Math.min(width,height) * monster.speed * (1 + alert * .64) * (huntUntil > now ? 1.30 : 1); move(monster,dx/length*speed*delta,dy/length*speed*delta); } }
      else if (monster.mode === "search") { if (now > monster.searchUntil) monster.mode = "patrol"; }
      else { const waypoint = monster.route[monster.routeIndex], dx=waypoint.x-monster.x, dy=waypoint.y-monster.y, length=Math.hypot(dx,dy); if (length < 6) monster.routeIndex = (monster.routeIndex + 1) % monster.route.length; else { const speed = Math.min(width,height) * monster.speed; move(monster,dx/length*speed*delta,dy/length*speed*delta); } }
      if (!sheltered && dist(player.x,player.y,monster.x,monster.y) < player.r + monster.r + 2) endGame("lost");
    }
    function updateBait(now) { if (!bait) return; if (now >= bait.armedAt) bait.ready = true; if (bait.ready && bait.pulsesLeft > 0 && now >= bait.nextPulseAt) { const pulse = makePulse(bait.x,bait.y,"bait"); pulse.max = Math.min(width,height) * .38; pulses.push(pulse); bait.pulsesLeft -= 1; bait.nextPulseAt = now + 950; baitSound(); } if (now >= bait.expiresAt) { bait = null; showLog("诱饵静默。",1500); } }
    function update(delta, now) {
      if (state !== "playing") return;
      alert = Math.max(0,alert - delta*.043);
      if (charge < 3 && now >= nextChargeAt) { charge += 1; nextChargeAt = charge < 3 ? now + currentChapter().cooldown : 0; if (audio) tone(350,.055,.012,"sine",470); }
      if (DEMO && now - lastDemoAt > 2100) { emitPulse(); lastDemoAt = now; } else if (!DEMO) updatePlayer(delta);
      updateBait(now); pulses.forEach(pulse => { pulse.previousRadius=pulse.radius; pulse.radius += pulse.speed*delta; scanPulse(pulse,now); }); pulses = pulses.filter(pulse => { if (pulse.radius >= pulse.max) { traces.push({ x:pulse.x, y:pulse.y, radius:pulse.max, type:pulse.type, expires:now+420 }); return false; } return true; }); traces = traces.filter(trace => trace.expires > now);
      if (huntUntil > now && !isSheltered() && now - lastHuntTargetAt > 520) { monsters.forEach(monster => setMonsterTarget(monster,player.x,player.y,now)); lastHuntTargetAt = now; }
      monsters.forEach(monster => updateMonster(monster,delta,now));
      if (huntUntil && now > huntUntil) { showLog("门已闭合。",1800); endGame("lost"); }
      if (exit.unlocked && dist(player.x,player.y,exit.x,exit.y) < player.r+exit.r+2) endGame("won");
      updateHud(now);
    }
    function alphaUntil(until, now) { return clamp((until-now)/currentChapter().fade,0,1); }
    function drawWall(rect, alpha) { if (alpha<=0) return;ctx.save();ctx.strokeStyle=COLORS.white;ctx.lineWidth=1.02;ctx.shadowColor="rgba(255,255,255,.62)";ctx.shadowBlur=4;const horizontal=rect.w>=rect.h,length=horizontal?rect.w:rect.h,minor=horizontal?rect.h*.5:rect.w*.5,ox=rect.x+(horizontal?0:rect.w*.5),oy=rect.y+(horizontal?rect.h*.5:0),cuts=[[.10,.11],[.47,.16],[.84,.045]];cuts.forEach(([o,s],index)=>{ctx.globalAlpha=Math.pow(alpha,1.92)*(.72-index*.18);const a=length*o,b=Math.min(length*(o+s),length);ctx.beginPath();if(horizontal){ctx.moveTo(ox+a,oy+minor*Math.sin(o*21));ctx.lineTo(ox+b,oy-minor*Math.sin(o*19));}else{ctx.moveTo(ox+minor*Math.sin(o*19),oy+a);ctx.lineTo(ox-minor*Math.sin(o*21),oy+b);}ctx.stroke();});ctx.restore(); }
    function drawPulse(pulse) { const progress=pulse.radius/pulse.max;ctx.save();ctx.globalAlpha=(1-progress)*(pulse.type==="bait"?.45:.94);ctx.strokeStyle=COLORS.white;ctx.lineWidth=pulse.type==="bait"?.8:1.34;ctx.setLineDash(pulse.type==="bait"?[2,8]:[]);ctx.shadowColor="rgba(255,255,255,.64)";ctx.shadowBlur=pulse.type==="bait"?3:8;ctx.beginPath();ctx.arc(pulse.x,pulse.y,pulse.radius,0,Math.PI*2);ctx.stroke();ctx.restore(); }
    function drawTrace(trace, now) { const alpha=clamp((trace.expires-now)/420,0,1);ctx.save();ctx.globalAlpha=alpha*(trace.type==="bait"?.16:.33);ctx.strokeStyle=COLORS.white;ctx.lineWidth=.8;ctx.setLineDash([3,13]);ctx.beginPath();ctx.arc(trace.x,trace.y,trace.radius,.12,Math.PI*1.74);ctx.stroke();ctx.restore(); }
    function drawMonster(monster, now) { const alpha=alphaUntil(monster.revealUntil,now); if(alpha<=0)return; const jitter=monster.mode==="search"?Math.sin(now*.028+monster.phase)*1.6:0, points=[[-12,0],[-8,-5],[-4,4],[0,-7],[4,6],[9,-3],[13,1]];ctx.save();ctx.translate(monster.x+jitter,monster.y);ctx.globalAlpha=Math.pow(alpha,.72);ctx.strokeStyle="#d44349";ctx.lineWidth=1.45;ctx.shadowColor="rgba(161,42,48,.8)";ctx.shadowBlur=8;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.fillStyle="#e95a5f";ctx.beginPath();ctx.arc(-2,-1,1.1,0,Math.PI*2);ctx.fill();ctx.restore(); }
    function drawRecord(record, now) { const alpha=alphaUntil(record.revealUntil,now);if(alpha<=0)return;ctx.save();ctx.translate(record.x,record.y);ctx.rotate(Math.PI/4);ctx.globalAlpha=Math.pow(alpha,.56);ctx.strokeStyle=COLORS.gold;ctx.lineWidth=1.15;ctx.shadowColor="rgba(211,170,88,.82)";ctx.shadowBlur=9;ctx.strokeRect(-3.4,-3.4,6.8,6.8);ctx.restore(); }
    function drawShelter(shelter, now) { const alpha=alphaUntil(shelter.revealUntil,now);if(alpha<=0)return;ctx.save();ctx.globalAlpha=Math.pow(alpha,.44);ctx.strokeStyle=COLORS.white;ctx.lineWidth=.8;ctx.setLineDash([3,6]);ctx.beginPath();ctx.arc(shelter.x,shelter.y,shelter.r,0,Math.PI*2);ctx.stroke();ctx.restore(); }
    function drawExit(now) { const alpha=exit.unlocked?Math.max(alphaUntil(exit.revealUntil,now),.22):alphaUntil(exit.revealUntil,now);if(alpha<=0)return;ctx.save();ctx.globalAlpha=Math.pow(alpha,.68);const glow=ctx.createRadialGradient(exit.x,exit.y,0,exit.x,exit.y,18);glow.addColorStop(0,"rgba(211,170,88,.66)");glow.addColorStop(1,"rgba(211,170,88,0)");ctx.fillStyle=glow;ctx.beginPath();ctx.arc(exit.x,exit.y,18,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#e3bf72";ctx.lineWidth=1.05;ctx.shadowColor="rgba(211,170,88,.72)";ctx.shadowBlur=8;ctx.beginPath();ctx.arc(exit.x,exit.y,exit.unlocked?4:3,0,Math.PI*2);ctx.stroke();if(!exit.unlocked){ctx.beginPath();ctx.moveTo(exit.x-3,exit.y+3);ctx.lineTo(exit.x+3,exit.y-3);ctx.stroke();}ctx.restore(); }
    function drawBait(now) { if(!bait)return;ctx.save();ctx.globalAlpha=bait.ready?.64:.22;ctx.strokeStyle=COLORS.white;ctx.lineWidth=.85;ctx.setLineDash([2,5]);ctx.beginPath();ctx.arc(bait.x,bait.y,bait.ready?8:4,0,Math.PI*2);ctx.stroke();ctx.restore(); }
    function drawPlayer(now) { const exposure=clamp((player.exposedUntil-now)/460,0,1), sheltered=isSheltered();ctx.save();if(exposure>0){const halo=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,20);halo.addColorStop(0,`rgba(161,42,48,${exposure*.24})`);halo.addColorStop(1,"rgba(161,42,48,0)");ctx.fillStyle=halo;ctx.beginPath();ctx.arc(player.x,player.y,20,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=.26+exposure*.34;ctx.strokeStyle=COLORS.white;ctx.lineWidth=.75;ctx.beginPath();ctx.arc(player.x,player.y,7.5,.28,Math.PI*1.63);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=COLORS.white;ctx.shadowColor=sheltered?"rgba(246,246,242,.34)":"rgba(255,255,255,.95)";ctx.shadowBlur=sheltered?4:9;ctx.beginPath();ctx.arc(player.x,player.y,player.r*.62,0,Math.PI*2);ctx.fill();ctx.restore(); }
    function render(now) { ctx.clearRect(0,0,width,height);traces.forEach(trace=>drawTrace(trace,now));pulses.forEach(drawPulse);screenWalls().forEach((wall,i)=>drawWall(wall,alphaUntil(reveal[i],now)));shelters.forEach(shelter=>drawShelter(shelter,now));drawExit(now);records.forEach(record=>drawRecord(record,now));drawBait(now);monsters.forEach(monster=>drawMonster(monster,now));drawPlayer(now); }
    function frame(now) { const delta=Math.min(.035,(now-lastTime)/1000);lastTime=now;update(delta,now);render(now);requestAnimationFrame(frame); }
    function actionInput() { if(state==="brief")beginChapter(); else if(state==="interchapter")nextChapter(); }
    addEventListener("keydown",event=>{const key=event.key.toLowerCase();if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(key)){keys[key]=true;event.preventDefault();}if(key==="enter")actionInput();if(key===" "){event.preventDefault();deployBait();}if(key==="r"){if(state==="won")startNewRun();else if(state==="lost")loadChapter(chapterIndex);}});
    addEventListener("keyup",event=>{keys[event.key.toLowerCase()]=false;});
    addEventListener("pointerdown",event=>{if(event.button!==0)return;if(state==="brief"||state==="interchapter")actionInput();else if(state==="playing")emitPulse();});
    addEventListener("resize",resize);
    resize();loadChapter(0,true);if(DEMO) beginChapter();requestAnimationFrame(frame);
  })();
  </script>
